<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AUA tab access</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>AUA tab access</h1>
      <p id="status">Checking this tab…</p>
      <button id="attach" type="button">Attach this tab</button>
      <button id="detach" type="button" class="secondary" hidden>Detach</button>
      <p class="note">Only this tab is shared. AUA cannot read cookies, history, or other tabs.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
