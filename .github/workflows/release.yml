name: Release

# CI runs on branches and pull requests only, so pushing a tag used to run nothing at all —
# a tag was just a label on a commit nobody had re-checked. This workflow makes `git push
# --follow-tags` the whole release: it refuses a tag whose version disagrees with the four
# manifests or has no changelog entry, re-runs the full suite at the tagged commit, and only
# then publishes a GitHub Release with notes lifted straight out of CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']
  # A manual run is a DRY RUN: everything is checked and built, nothing is published. Use it to
  # see the release notes a tag would produce before committing to the tag.
  workflow_dispatch:

# CI only needs `contents: read`; creating a Release is a write. Declared here rather than
# widening ci.yml, so the token that can publish exists only in this file.
permissions:
  contents: write

# Unlike ci.yml, this must NOT cancel in progress: a half-published release (assets uploaded,
# Release not created, or vice versa) is worse than a duplicate run. Tags are unique anyway, so
# the group only ever guards against a re-run of the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------
  # Nothing is built or published until the tag, the manifests and the changelog agree. This
  # job is deliberately project-dependency-free: setup-python supplies tomllib and json, so it
  # answers "is this tag coherent?" in seconds without resolving the project environment.
  # ---------------------------------------------------------------------------------------
  guard:
    name: tag matches the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      # The check below reads pyproject.toml with tomllib, which is 3.11+. Pinning to the
      # repo's own .python-version rather than the runner's default python3 means a future
      # `ubuntu-latest` rolling back to an older interpreter cannot break the release gate.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - id: check
        name: Verify the version and extract the release notes
        run: |
          set -euo pipefail

          # On a tag push the tag is the source of truth. A manual dry run has no tag, so
          # pyproject supplies the version and the same four-way comparison still runs.
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
            echo "::notice::Dry run — no tag. Using the version in pyproject.toml: $version"
          fi
          echo "Releasing version: $version"

          # The version lives in four hand-maintained files. Any one of them drifting ships a
          # CLI that reports a version its plugin manifest disagrees with, so name the file
          # that is wrong rather than failing with a bare mismatch.
          python3 - "$version" <<'PY'
          import json, pathlib, re, sys, tomllib

          want = sys.argv[1]
          init = pathlib.Path("src/android_ui_analyser/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE)

          found = {
              "pyproject.toml": tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"],
              "src/android_ui_analyser/__init__.py": match.group(1) if match else "<no __version__ line>",
              ".claude-plugin/plugin.json": json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())["version"],
              ".claude-plugin/marketplace.json": json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())["plugins"][0]["version"],
          }

          disagree = {path: got for path, got in found.items() if got != want}
          for path, got in disagree.items():
              print(f"::error file={path}::says {got}, but this release is {want}")
          if disagree:
              print(f"Release version {want} does not match: {', '.join(disagree)}", file=sys.stderr)
              print("Fix with: scripts/bump-version.sh " + want, file=sys.stderr)
              sys.exit(1)
          print(f"All four manifests agree on {want}.")
          PY

          # The whole point of the release is telling people what changed, so an entry is
          # mandatory — a tag with no changelog section fails here instead of publishing an
          # empty Release.
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$version] - <date>' heading; run scripts/bump-version.sh first"
            exit 1
          fi

          # Print the body of this version's section: everything after its heading, up to the
          # next `## [` heading (the previous release) or end of file.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\] - " { inside = 1; next }
            inside && /^## \[/          { exit }
            inside && /^\[[^]]+\]:/      { exit }
            inside                      { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::the '## [$version]' section is empty"
            exit 1
          fi

          echo "--- release notes ---"
          cat release-notes.md
          echo "---------------------"

          # Hand both to the later jobs. The notes are multi-line, so they need the delimiter
          # form of $GITHUB_OUTPUT.
          {
            echo "version=$version"
            echo "notes<<AUA_RELEASE_NOTES_EOF"
            cat release-notes.md
            echo "AUA_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------
  # The same checks ci.yml runs, re-run at the tagged commit. CI never sees a tag push, so
  # without this a release would ship whatever the tag happened to point at.
  # ---------------------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Identical to ci.yml: exactly the extras the suite asserts against, because
      # tests/test_ocr.py requires paddleocr, tesseract and easyocr to report *unavailable*.
      - run: uv sync --frozen --extra dev --extra apple --extra rapidocr --extra audio
      # ruff and mypy are platform-independent, so one runner is enough — no reason to pay for
      # them twice on a release.
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run mypy
      # `-n auto` comes from pyproject addopts; runners are small, so cap the shard count.
      - run: uv run pytest -n 2

  # ---------------------------------------------------------------------------------------
  # Build the artifacts and publish. Reached only once the tag is coherent and green.
  # ---------------------------------------------------------------------------------------
  release:
    name: publish the GitHub Release
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Produces dist/*.whl and dist/*.tar.gz. Attached to the Release so a user can install an
      # exact version without a clone; `dist/` is gitignored, so this cannot dirty the tree.
      - run: uv build

      # The guard already lifted this version's section out of CHANGELOG.md; write it back to a
      # file for `gh release create --notes-file`. Passed through the environment rather than
      # interpolated into the script, so changelog text is never parsed as shell.
      - name: Restore the extracted release notes
        env:
          NOTES: ${{ needs.guard.outputs.notes }}
        run: printf '%s\n' "$NOTES" > release-notes.md

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # A tag like v0.14.0-rc1 is a pre-release: SemVer says anything after the first `-`
          # is a pre-release identifier, and GitHub should not offer it as "latest".
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease); echo "Pre-release identifier detected in $VERSION" ;;
          esac
          # The helper APK rides along because it is the one artifact people fetch on its own,
          # to sideload onto a device without installing the CLI.
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            dist/* \
            src/android_ui_analyser/data/aua-helper.apk

      - name: Dry run — what a tag would publish
        if: github.event_name != 'push'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          echo "DRY RUN: nothing was published. Tag v${VERSION} would create a Release with:"
          echo
          echo "  title: v${VERSION}"
          echo "  assets:"
          ls -1 dist/ | sed 's/^/    dist\//'
          echo "    src/android_ui_analyser/data/aua-helper.apk"
          echo
          echo "  notes:"
          sed 's/^/    /' release-notes.md

# ------------------------------------------------------------------------------------------
# OFF: publishing to PyPI. Uncomment the job below to turn it on.
#
# This is not a packaging switch, it is a licensing decision: the wheel embeds the modified
# FunctionGemma derivative under src/android_ui_analyser/resources/functiongemma/, which is
# ~99% of its 30 MB and is distributed under the Gemma Terms of Use, not MIT. Publishing to
# PyPI redistributes that to the world. Decide that first.
#
# To turn it on, the maintainer must:
#   1. Create the `android-ui-analyser` project on PyPI (or claim the name).
#   2. On PyPI → the project → Publishing, add a Trusted Publisher with:
#        owner:       The-Wordlab
#        repository:  Android-UI-Analyser
#        workflow:    release.yml          <- this file's name, exactly
#        environment: pypi                 <- must match `environment:` below
#   3. Create the `pypi` environment in GitHub → Settings → Environments (add required
#      reviewers there if a human should approve every publish).
#   4. Delete the `#` markers from the block below.
# No API token is needed: Trusted Publishing exchanges the job's OIDC identity for a
# short-lived one, which is why `id-token: write` is the only permission it takes.
#
#   pypi:
#     name: publish to PyPI
#     needs: [guard, test, release]
#     if: github.event_name == 'push'
#     runs-on: ubuntu-latest
#     timeout-minutes: 15
#     environment: pypi
