# V6 trains from the base FunctionGemma checkpoint on the frozen v5 corpus plus
# exact production policy contexts expanded across all order/ID permutations.
# Checkpoint selection requires a complete permutation-group pass, zero
# unauthorized/redundant selections, and the best worst-family accuracy.
model: mlx-community/functiongemma-270m-it-bf16
train: true
test: false
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01

data: runs/functiongemma/data-v6
adapter_path: runs/functiongemma/adapters/lora-r32-v6
seed: 53
num_layers: -1
batch_size: 8
grad_accumulation_steps: 4
iters: 8192
learning_rate: 2.0e-6
steps_per_report: 20
steps_per_eval: 1024
save_every: 512
val_batches: 128
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: false
report_to: null

lora_parameters:
  rank: 32
  scale: 64.0
  dropout: 0.05
