# Qwen3-0.6B comparison run on the exact frozen AUA v7 semantic curriculum.
# It uses Qwen's native tool-call template and is evaluated with the same strict
# candidate, safety, permutation, and held-out semantic gates as FunctionGemma.
model: Qwen/Qwen3-0.6B-MLX-bf16
train: true
test: false
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01

data: runs/functiongemma/data-v7
adapter_path: runs/functiongemma/adapters/lora-r32-qwen3-0.6b-v7
seed: 83
num_layers: -1
batch_size: 8
grad_accumulation_steps: 4
iters: 6144
learning_rate: 1.0e-5
steps_per_report: 20
steps_per_eval: 1024
save_every: 1024
val_batches: 128
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: false
report_to: null

lora_parameters:
  rank: 32
  scale: 64.0
  dropout: 0.05
