# V10 trains fresh from the base FunctionGemma checkpoint on the merged corpus:
# the frozen V8 foundations plus the V10 command-surface families.
#
# Sizing note. The corpus is 262,584 training rows, and 8192 iters x batch 8 x
# grad-accum 4 = 262,144 samples, so this schedule is almost exactly one pass.
# That is deliberate. V9 reached 0.000 validation loss by iteration 1,536 on a
# corpus it could memorise; the V10 families are built so that memorising is not
# available, and a single pass over far more diverse data is the honest first
# measurement. If the checkpoints underfit rather than saturate, raise iters
# rather than narrowing the data.
#
# Checkpoint selection must maximise the WORST family under perfect protocol
# with zero unsafe, unauthorized, redundant, or premature-finish selections —
# never loss, and never aggregate accuracy. V9's validation loss was 0.000 at
# both a good checkpoint and one that scored 0/6 on refusing an absent target,
# so loss carries no signal about the property that matters.
model: mlx-community/functiongemma-270m-it-bf16
train: true
test: false
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01

data: runs/functiongemma/data-v10
adapter_path: runs/functiongemma/adapters/lora-r32-v10-seed103
seed: 103
num_layers: -1
batch_size: 8
grad_accumulation_steps: 4
iters: 8192
learning_rate: 2.0e-6
steps_per_report: 20
steps_per_eval: 512
save_every: 512
val_batches: 160
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: false
report_to: null

lora_parameters:
  rank: 32
  scale: 64.0
  dropout: 0.05
