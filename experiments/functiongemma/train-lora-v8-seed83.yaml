# V8 trains fresh from the base FunctionGemma checkpoint. It retains the frozen
# v7 foundations and adds exact-runtime hard negatives plus an authenticated,
# non-executing -1 handoff outcome. Checkpoint selection must maximize the worst
# validation family under perfect protocol and zero unsafe/redundant selections.
model: mlx-community/functiongemma-270m-it-bf16
train: true
test: false
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01

data: runs/functiongemma/data-v8
adapter_path: runs/functiongemma/adapters/lora-r32-v8
seed: 83
num_layers: -1
batch_size: 8
grad_accumulation_steps: 4
iters: 8192
learning_rate: 2.0e-6
steps_per_report: 20
steps_per_eval: 512
save_every: 512
val_batches: 160
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: false
report_to: null

lora_parameters:
  rank: 32
  scale: 64.0
  dropout: 0.05
