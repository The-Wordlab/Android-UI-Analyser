version: 1
checkpoints:
  - id: default_name_order
    description: Confirm all four classic products start in name order with their correct prices
    assertions: &name_order
      - assert: {rid: "dev.aua.fixture:id/classic_grid", exists: true}
      - assert: {text: "Current order: name", text_is: "Current order: name"}
      - assert: {rid: classic_item_card, count: 4}
      - assert_order:
          axis: reading
          selectors:
            - {text: Alpine Mug}
            - {text: Beacon Lamp}
            - {text: Cedar Notebook}
            - {text: Drift Puzzle}
      - assert:
          rid: classic_item_card
          index: 0
          contains_all: [{text: Alpine Mug}, {text: "$7.99"}]
      - assert:
          rid: classic_item_card
          index: 1
          contains_all: [{text: Beacon Lamp}, {text: "$12.50"}]
      - assert:
          rid: classic_item_card
          index: 2
          contains_all: [{text: Cedar Notebook}, {text: "$4.25"}]
      - assert:
          rid: classic_item_card
          index: 3
          contains_all: [{text: Drift Puzzle}, {text: "$18.00"}]
  - id: price_sorted
    description: Confirm all four classic products are ordered by ascending price with correct price pairing
    assertions:
      - assert: {rid: "dev.aua.fixture:id/classic_grid", exists: true}
      - assert: {text: "Current order: price", text_is: "Current order: price"}
      - assert: {rid: classic_item_card, count: 4}
      - assert_order:
          axis: reading
          selectors:
            - {text: Cedar Notebook}
            - {text: Alpine Mug}
            - {text: Beacon Lamp}
            - {text: Drift Puzzle}
      - assert:
          rid: classic_item_card
          index: 0
          contains_all: [{text: Cedar Notebook}, {text: "$4.25"}]
      - assert:
          rid: classic_item_card
          index: 1
          contains_all: [{text: Alpine Mug}, {text: "$7.99"}]
      - assert:
          rid: classic_item_card
          index: 2
          contains_all: [{text: Beacon Lamp}, {text: "$12.50"}]
      - assert:
          rid: classic_item_card
          index: 3
          contains_all: [{text: Drift Puzzle}, {text: "$18.00"}]
  - id: name_order_restored
    description: Restore name order and verify all four classic products and prices before returning home
    assertions: *name_order
cleanup:
  description: Return to the fixture home after the restored name order was verified
  assertions:
    - assert: {rid: fixture_home, exists: true}
    # A short rid falls back to substring matching and also finds open_classic_grid.
    - assert: {rid: "dev.aua.fixture:id/classic_grid", absent: true}
